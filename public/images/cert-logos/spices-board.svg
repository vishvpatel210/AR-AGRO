<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="200" height="80">
  <!-- Ship silhouette (Spices Board of India uses a ship emblem) -->
  <g transform="translate(32,42)">
    <!-- hull -->
    <path d="M-24,0 Q-20,10 0,12 Q20,10 24,0Z" fill="#1d3d7f" opacity="0.85"/>
    <!-- mast -->
    <line x1="0" y1="-22" x2="0" y2="8" stroke="#1d3d7f" stroke-width="2"/>
    <!-- sails -->
    <path d="M0,-20 L-14,-4 L0,-2Z" fill="#1d3d7f" opacity="0.75"/>
    <path d="M0,-20 L14,-4 L0,-2Z" fill="#1d3d7f" opacity="0.55"/>
    <!-- waves -->
    <path d="M-28,14 Q-20,18 -12,14 Q-4,10 4,14 Q12,18 20,14 Q24,12 28,14" fill="none" stroke="#1d3d7f" stroke-width="1.2"/>
  </g>
  <!-- Text -->
  <g transform="translate(70,40)">
    <text y="-10" font-family="Inter,Arial Black,sans-serif" font-size="11.5" font-weight="800" fill="#1d3d7f">SPICES BOARD</text>
    <text y="4" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="600" fill="#1d3d7f">OF INDIA</text>
    <text y="17" font-family="Inter,Arial,sans-serif" font-size="6" fill="#555">Ministry of Commerce &amp; Industry</text>
  </g>
</svg>
