<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <g transform="translate(60,60)">
    <!-- outer ring -->
    <circle r="54" fill="none" stroke="#7b5e2e" stroke-width="2.5"/>
    <circle r="49" fill="none" stroke="#7b5e2e" stroke-width="0.8" stroke-dasharray="2.5 2"/>
    <circle r="42" fill="none" stroke="#7b5e2e" stroke-width="1.5"/>

    <!-- top arc -->
    <path id="gmpTop" d="M -37,0 A 37,37 0 0,1 37,0" fill="none"/>
    <text font-family="Inter,Arial,sans-serif" font-size="7" font-weight="800" fill="#7b5e2e" letter-spacing="2">
      <textPath href="#gmpTop" startOffset="50%" text-anchor="middle">GOOD MANUFACTURING</textPath>
    </text>

    <!-- center text -->
    <text y="-4" font-family="Inter,Arial Black,sans-serif" font-size="18" font-weight="900" fill="#7b5e2e" text-anchor="middle">GMP</text>
    <text y="9" font-family="Inter,Arial,sans-serif" font-size="5.5" fill="#7b5e2e" text-anchor="middle">CERTIFIED</text>

    <!-- bottom arc -->
    <path id="gmpBot" d="M -37,0 A 37,37 0 0,0 37,0" fill="none"/>
    <text font-family="Inter,Arial,sans-serif" font-size="6.5" font-weight="700" fill="#7b5e2e" letter-spacing="1.5">
      <textPath href="#gmpBot" startOffset="50%" text-anchor="middle">PRACTICE</textPath>
    </text>
  </g>
</svg>
