<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="200" height="80">
  <!-- MSME Udyam Registration -->
  <!-- Gear/cog icon -->
  <g transform="translate(30,40)">
    <circle r="10" fill="#1d3d7f" opacity="0.12"/>
    <circle r="10" fill="none" stroke="#1d3d7f" stroke-width="2.5"/>
    <circle r="5" fill="#1d3d7f" opacity="0.5"/>
    <!-- gear teeth -->
    <rect x="-2" y="-22" width="4" height="7" rx="1" fill="#1d3d7f"/>
    <rect x="-2" y="15" width="4" height="7" rx="1" fill="#1d3d7f"/>
    <rect x="-22" y="-2" width="7" height="4" rx="1" fill="#1d3d7f"/>
    <rect x="15" y="-2" width="7" height="4" rx="1" fill="#1d3d7f"/>
    <rect x="-17" y="-17" width="5" height="5" rx="1" fill="#1d3d7f" transform="rotate(45, -14.5, -14.5)"/>
    <rect x="12" y="-17" width="5" height="5" rx="1" fill="#1d3d7f" transform="rotate(45, 14.5, -14.5)"/>
    <rect x="-17" y="12" width="5" height="5" rx="1" fill="#1d3d7f" transform="rotate(45, -14.5, 14.5)"/>
    <rect x="12" y="12" width="5" height="5" rx="1" fill="#1d3d7f" transform="rotate(45, 14.5, 14.5)"/>
  </g>
  <g transform="translate(60,40)">
    <text y="-10" font-family="Inter,Arial Black,sans-serif" font-size="17" font-weight="900" fill="#1d3d7f">MSME</text>
    <text y="4" font-family="Inter,Arial,sans-serif" font-size="8.5" font-weight="700" fill="#ff6600">Udyam Registered</text>
    <text y="16" font-family="Inter,Arial,sans-serif" font-size="6" fill="#555">Govt. of India Enterprise</text>
  </g>
</svg>
