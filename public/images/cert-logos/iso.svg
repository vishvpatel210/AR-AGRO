<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" width="240" height="80">
  <g transform="translate(120, 40)">
    <!-- Outer dashed/solid rings -->
    <circle r="36" fill="none" stroke="#1d487f" stroke-width="2.5" />
    <circle r="32.5" fill="none" stroke="#1d487f" stroke-width="0.8" stroke-dasharray="2 1.5" />
    <circle r="26" fill="none" stroke="#1d487f" stroke-width="1.2" />
    
    <!-- Top Arc Path for "CERTIFIED" -->
    <path id="isoTopArc" d="M -23,0 A 23,23 0 0,1 23,0" fill="none" />
    <text font-family="'Inter', 'Arial', sans-serif" font-size="6" font-weight="700" fill="#1d487f" letter-spacing="1.5">
      <textPath href="#isoTopArc" startOffset="50%" text-anchor="middle">
        CERTIFIED
      </textPath>
    </text>

    <!-- Center ISO & 9001:2015 -->
    <text y="-2" font-family="'Inter', 'Arial Black', sans-serif" font-size="12" font-weight="900" fill="#1d487f" text-anchor="middle" letter-spacing="1">
      ISO
    </text>
    <text y="7" font-family="'Inter', 'Arial', sans-serif" font-size="5.5" font-weight="700" fill="#1d487f" text-anchor="middle">
      9001:2015
    </text>

    <!-- Bottom Arc Path for "COMPANY" -->
    <path id="isoBottomArc" d="M -23,0 A 23,23 0 0,0 23,0" fill="none" />
    <text font-family="'Inter', 'Arial', sans-serif" font-size="6" font-weight="700" fill="#1d487f" letter-spacing="1.5">
      <textPath href="#isoBottomArc" startOffset="50%" text-anchor="middle">
        COMPANY
      </textPath>
    </text>

    <!-- Stars -->
    <polygon points="-24.5,-1 -23.5,-3.5 -22.5,-1 -20.5,-1 -22,0.2 -21.5,2.5 -23.5,1.2 -25.5,2.5 -25,0.2 -26.5,-1" fill="#1d487f" transform="scale(0.5) translate(-25, 0)" />
    <polygon points="24.5,-1 25.5,-3.5 26.5,-1 28.5,-1 27,0.2 27.5,2.5 25.5,1.2 23.5,2.5 24,0.2 22.5,-1" fill="#1d487f" transform="scale(0.5) translate(25, 0)" />
  </g>
</svg>
