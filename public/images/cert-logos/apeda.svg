<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="200" height="80">
  <!-- APEDA eagle / leaf emblem placeholder -->
  <g transform="translate(30,40)">
    <!-- Stylized leaf / wheat -->
    <ellipse cx="0" cy="-10" rx="12" ry="18" fill="#2a7a3b" opacity="0.15"/>
    <path d="M0,8 Q-10,-5 0,-20 Q10,-5 0,8Z" fill="#2a7a3b" opacity="0.85"/>
    <line x1="0" y1="8" x2="0" y2="-20" stroke="#2a7a3b" stroke-width="1.5"/>
    <!-- wings hint -->
    <path d="M0,-6 Q-20,-12 -22,-4" fill="none" stroke="#2a7a3b" stroke-width="1.5"/>
    <path d="M0,-6 Q20,-12 22,-4" fill="none" stroke="#2a7a3b" stroke-width="1.5"/>
  </g>
  <!-- APEDA label -->
  <g transform="translate(60,40)">
    <text y="-10" font-family="Inter,Arial Black,sans-serif" font-size="19" font-weight="900" fill="#2a7a3b">APEDA</text>
    <text y="5" font-family="Inter,Arial,sans-serif" font-size="6.5" fill="#555">Agricultural &amp; Processed Food</text>
    <text y="15" font-family="Inter,Arial,sans-serif" font-size="6.5" fill="#555">Products Export Development Authority</text>
  </g>
</svg>
